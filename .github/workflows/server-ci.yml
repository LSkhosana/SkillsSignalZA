name: Server CI

on:
  push:
    branches:
      - main
    paths:
      - "Server/**"
      - ".github/workflows/server-ci.yml"
      - "Context/SkillSignalZA_Readiness_Report_Engine_Contract_V1.md"
      - "Context/SkillSignalZA_Readiness_Report_Engine_Contract_V1_1.md"
      - "Context/SkillSignalZA_Readiness_Report_Engine_Contract_V1_2.md"
      - "Context/SkillSignalZA_Package_C_Golden_Candidate_Fixtures_Implementation_Brief_V1.md"
      - "Context/SkillSignalZA_Package_C_1_Scoring_Context_Fixture_Correction_Brief_V1.md"

  pull_request:
    branches:
      - main
    paths:
      - "Server/**"
      - ".github/workflows/server-ci.yml"
      - "Context/SkillSignalZA_Readiness_Report_Engine_Contract_V1.md"
      - "Context/SkillSignalZA_Readiness_Report_Engine_Contract_V1_1.md"
      - "Context/SkillSignalZA_Readiness_Report_Engine_Contract_V1_2.md"
      - "Context/SkillSignalZA_Package_C_Golden_Candidate_Fixtures_Implementation_Brief_V1.md"
      - "Context/SkillSignalZA_Package_C_1_Scoring_Context_Fixture_Correction_Brief_V1.md"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Server

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Server/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install server dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest --cov-fail-under=90

      - name: Run Ruff linting
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

  docker:
    name: Docker build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build server image
        run: docker build --tag skillsignalza-api:ci Server
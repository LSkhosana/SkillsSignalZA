[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skillsignalza-api"
version = "0.1.0"
description = "SkillSignalZA API: HTTP transport for assessments. Scoring lives in the engine, not in routes."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "SkillSignalZA" }]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-q",
    "--strict-markers",
    "--cov=app",
    "--cov-report=term-missing",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
